{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <h1 class="h4 mb-3">{{ titulo }}</h1>
        <p class="mb-4">{{ mensaje }}</p>
        <form method="post" action="{{ accion_url }}">
          {{ form.hidden_tag() }}
          <button type="submit" class="btn btn-{{ estilo | default('danger') }}">{{ confirmar_texto | default('Confirmar') }}</button>
          <a href="{{ volver_url }}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
