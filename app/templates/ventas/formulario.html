{% extends "base.html" %}
{% block titulo %}Nueva venta{% endblock %}

{% block contenido %}
<h1 class="h3 mb-4">Nueva venta</h1>

<form method="post" novalidate>
  {{ form.hidden_tag() }}
  {# Submit implícito (Enter) = guardar, no añadir línea #}
  <button type="submit" name="accion" value="guardar" class="visually-hidden" tabindex="-1" aria-hidden="true"></button>

  <div class="row g-3 mb-3">
    <div class="col-md-6">
      <label class="form-label">Cliente (opcional)</label>
      <input type="text" name="cliente" class="form-control" placeholder="Nombre del cliente" value="{{ cliente }}">
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Líneas de la venta</span>
      <button type="submit" name="accion" value="add" class="btn btn-sm btn-outline-primary">+ Añadir línea</button>
    </div>
    <div class="table-responsive">
      <table class="table mb-0 align-middle">
        <thead><tr><th style="width:60%">Producto</th><th>Cantidad</th><th></th></tr></thead>
        <tbody>
          {% for l in lineas %}
          <tr>
            <td>
              <select name="producto_id" class="form-select">
                <option value="">— Producto —</option>
                {% for p in productos %}
                <option value="{{ p.id }}" {% if l.producto_id|string == p.id|string %}selected{% endif %}>
                  {{ p.referencia }} · {{ p.nombre }} ({{ "%.2f"|format(p.precio_venta) }} €, stock {{ p.stock_actual }})
                </option>
                {% endfor %}
              </select>
            </td>
            <td><input type="number" name="cantidad" class="form-control" min="1" value="{{ l.cantidad }}"></td>
            <td><button type="submit" name="quitar" value="{{ loop.index0 }}" class="btn btn-outline-danger btn-sm">×</button></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

  <button type="submit" name="accion" value="guardar" class="btn btn-primary">Registrar venta</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('ventas.lista') }}">Cancelar</a>
</form>
{% endblock %}
